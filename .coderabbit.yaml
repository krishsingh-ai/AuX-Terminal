# CodeRabbit Configuration for AuX Terminal
# https://coderabbit.ai
version: "2"
language: "en-US"
tone_instructions: "You are an institutional financial software reviewer. Focus on code efficiency, React 19 best practices, strict TypeScript typing, Tailwind CSS consistency, and ensuring zero backend/server leaks in a 100% client-side application."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!package-lock.json"
    - "!.agent/**"
    - "!.agents/**"
    - "!.gemini/**"
    - "!**/*.log"

chat:
  auto_reply: true
